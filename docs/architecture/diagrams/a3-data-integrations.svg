<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a76b8"/></marker>
    <style>
      .band{fill:#1e5f96;} .bandT{fill:#fff;font-size:20px;font-weight:bold;} .bandS{fill:#cfe2f3;font-size:12px;}
      .zone{fill:#fcfcfa;stroke:#b8b8b0;stroke-width:1.2;} .zoneT{fill:#1e5f96;font-size:13px;font-weight:bold;letter-spacing:.4px;}
      .fs{fill:#d5e8d4;stroke:#82b366;stroke-width:1.5;} .ct{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.5;}
      .ig{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.5;} .rec{fill:#ffffff;stroke:#8a8a82;stroke-width:1;}
      .part{stroke-dasharray:6 3;}
      .h{font-size:13px;font-weight:bold;fill:#232323;} .t{font-size:11px;fill:#333;} .s{font-size:10px;fill:#555;}
      .m{font-family:Menlo,Consolas,monospace;font-size:9.5px;fill:#4a355c;}
      .note{fill:#fffde7;stroke:#c8b900;stroke-width:1;}
      .eB{stroke:#3a76b8;stroke-width:1.5;fill:none;}
    </style>
  </defs>
  <rect width="1920" height="1000" fill="#ffffff"/>
  <rect class="band" x="0" y="0" width="1920" height="44"/>
  <text class="bandT" x="20" y="29">Miniforge As-Built — A3. Persistence &amp; Integrations</text>
  <text class="bandS" x="1900" y="28" text-anchor="end">files + git bundles + R2, not a database · contracts are Transit golden fixtures · every integration is a shell-out or plain HTTP</text>

  <!-- PERSISTENCE -->
  <rect class="zone" x="20" y="62" width="920" height="620" rx="6"/>
  <text class="zoneT" x="36" y="84">PERSISTENCE MAP — where state actually lives</text>

  <rect class="fs" x="36" y="100" width="430" height="160" rx="8"/>
  <text class="h" x="48" y="122">~/.miniforge/ (user home)</text>
  <text class="m" x="48" y="142">config.edn            (+ [:governance] overrides)</text>
  <text class="m" x="48" y="158">checkpoints/&lt;wf&gt;/      authoritative machine snapshot</text>
  <text class="m" x="48" y="174">checkpoints/&lt;wf&gt;/&lt;task&gt;.bundle   git bundle per task</text>
  <text class="m" x="48" y="190">tools/*.edn</text>
  <text class="s" x="48" y="212">checkpoint_store default root; snapshots + bundles are</text>
  <text class="s" x="48" y="226">the recovery + harvest substrate</text>
  <rect class="fs" x="486" y="100" width="430" height="160" rx="8"/>
  <text class="h" x="498" y="122">repo-local .miniforge/ + work/</text>
  <text class="m" x="498" y="142">.miniforge/index/           repo-index</text>
  <text class="m" x="498" y="158">.miniforge/context-cache.edn · plan.edn</text>
  <text class="m" x="498" y="174">.miniforge/compliance-report.edn</text>
  <text class="m" x="498" y="190">work/{in-progress,done,failed}/*.spec.edn</text>
  <text class="s" x="498" y="212">the kanban and the per-repo working memory</text>
  <text class="s" x="498" y="226">QUEUE.md generated by bb work:queue</text>

  <rect class="ct" x="36" y="276" width="430" height="180" rx="8"/>
  <text class="h" x="48" y="298">contracts/ — the cross-process boundary</text>
  <text class="m" x="48" y="318">supervisory-entities/  agent · pr · decision · spec ·</text>
  <text class="m" x="48" y="334">  workflow-run · policy-eval · task-node · intervention</text>
  <text class="m" x="48" y="350">operator-events/  cancel · pause · retry-from-phase ·</text>
  <text class="m" x="48" y="366">  waive · force-safe-mode · request-human-review</text>
  <text class="m" x="48" y="382">event-stream/manifest.schema.json</text>
  <text class="s" x="48" y="404">Transit golden fixtures; regenerated by bb fixtures:supervisory;</text>
  <text class="s" x="48" y="418">VENDORED into miniforge-control (the Rust console's contract)</text>
  <text class="s" x="48" y="440" font-style="italic">known gap: Rust side is a hand-written mirror — see T3 #2</text>

  <rect class="fs" x="486" y="276" width="430" height="180" rx="8"/>
  <text class="h" x="498" y="298">event-stream + ETL state</text>
  <text class="m" x="498" y="318">event-stream: append-only pub/sub; JVM archive</text>
  <text class="m" x="498" y="334">  layer with fsync + atomic rename + manifest</text>
  <text class="m" x="498" y="354">&lt;pipeline&gt;/.cursors/&lt;name&gt;  incremental ETL cursors</text>
  <text class="m" x="498" y="370">  keyed [connector-ref schema-name]</text>
  <text class="s" x="498" y="392">formats: EDN (specs/config/defs) · Transit (goldens) ·</text>
  <text class="s" x="498" y="406">JSON (MCP, dashboard, GitHub) · git bundles</text>
  <text class="s" x="498" y="428" font-style="italic">datalevin backs the artifact + pipeline-pack stores;</text>
  <text class="s" x="498" y="442" font-style="italic">workflow state itself stays files + git bundles</text>

  <rect class="fs" x="36" y="472" width="880" height="90" rx="8"/>
  <text class="h" x="48" y="494">Harvest — local checkpoint recovery (no R2 in this loop)</text>
  <text class="m" x="48" y="514">bb harvest → ~/.miniforge/checkpoints/&lt;wf&gt;/&lt;task&gt;.bundle → harvest/&lt;wf&gt;/&lt;task&gt; branches</text>
  <text class="m" x="48" y="530">bb-r2 (wrangler wrapper) is a bb-utils helper consumed by Thesium risk — not miniforge's loop</text>
  <text class="s" x="48" y="550">bundles preserve agent work as real commits; harvest is the explicit, user-driven merge step</text>

  <rect class="note" x="36" y="578" width="880" height="86" rx="6"/>
  <text class="h" x="52" y="600">Reading the map</text>
  <text class="t" x="52" y="620">No database in the hot path: state = EDN files + append-only events + git bundles + object storage. The contracts/ directory is the only</text>
  <text class="t" x="52" y="638">formal cross-language boundary, and it is fixture-tested, not schema-enforced. This shapes the target work: T1's console and Fleet planes</text>
  <text class="t" x="52" y="656">both hang off these exact seams.</text>

  <!-- INTEGRATIONS -->
  <rect class="zone" x="960" y="62" width="940" height="620" rx="6"/>
  <text class="zoneT" x="976" y="84">INTEGRATION MAP — everything that crosses the process boundary</text>

  <rect class="ig" x="976" y="100" width="440" height="160" rx="8"/>
  <text class="h" x="988" y="122">LLM backends (llm/backends.edn)</text>
  <text class="m" x="988" y="142">CLI (babashka.process shell): claude · codex ·</text>
  <text class="m" x="988" y="158">  cursor ("agent") · opencode      [streaming]</text>
  <text class="m" x="988" y="174">HTTP: anthropic-api · openai-api · gemini-api ·</text>
  <text class="m" x="988" y="190">  openai-compat (LM Studio) · ollama   [no streaming]</text>
  <text class="m" x="988" y="206">echo (test)</text>
  <text class="s" x="988" y="228">~10 backend keys; model registry + selector + cost</text>
  <rect class="ig" x="1436" y="100" width="450" height="160" rx="8"/>
  <text class="h" x="1448" y="122">VCS / forge</text>
  <text class="m" x="1448" y="142">gh CLI: pr-lifecycle (merge · review · CI · conflicts)</text>
  <text class="m" x="1448" y="158">git: release-executor · bundles · merge_resolution</text>
  <text class="m" x="1448" y="174">connector-github (REST) · connector-gitlab · -jira</text>
  <text class="s" x="1448" y="196">plus tui-views/persistence/github.clj</text>
  <text class="s" x="1448" y="218">everything is shell-out or plain REST — no daemons</text>

  <rect class="ig" x="976" y="276" width="440" height="150" rx="8"/>
  <text class="h" x="988" y="298">Isolation ladder (dag-executor)</text>
  <text class="m" x="988" y="318">worktree executor (fallback) → docker/OCI → k8s Jobs</text>
  <text class="m" x="988" y="334">OCI CLIs: docker · podman · nerdctl (probe order)</text>
  <text class="m" x="988" y="350">plan-security: capsule-isolation hard-stop policies</text>
  <text class="s" x="988" y="372">(e.g. runtime-no-host-docker-socket) · no daemon API;</text>
  <text class="s" x="988" y="386">fully-qualified images; per-runtime quirks in registry.edn</text>
  <rect class="ig" x="1436" y="276" width="450" height="150" rx="8"/>
  <text class="h" x="1448" y="298">MCP surfaces</text>
  <text class="m" x="1448" y="318">in-repo bases: mcp-context-server · lsp-mcp-bridge</text>
  <text class="m" x="1448" y="334">bb mcp:config → Claude Code/Desktop/Codex configs</text>
  <text class="m" x="1448" y="350">miniforge-mcps repo: github-app .plugin (FastMCP</text>
  <text class="m" x="1448" y="366">  proxy for sandboxed Cowork agents)</text>
  <text class="s" x="1448" y="388">rule: brick-dependent MCPs live in-repo as bases;</text>
  <text class="s" x="1448" y="402">independent ones ship from miniforge-mcps</text>

  <rect class="ig" x="976" y="442" width="440" height="120" rx="8"/>
  <text class="h" x="988" y="464">Data Foundry connectors</text>
  <text class="m" x="988" y="484">github · gitlab · jira · edgar (SEC) · excel · http ·</text>
  <text class="m" x="988" y="500">file · sarif · linter · auth · retry · pipeline-output</text>
  <text class="s" x="988" y="522">incremental via cursor-store; data-quality +</text>
  <text class="s" x="988" y="536">dataset-schema validate en route</text>
  <rect class="ig" x="1436" y="442" width="450" height="120" rx="8"/>
  <text class="h" x="1448" y="464">Agent-vendor adapters (control plane)</text>
  <text class="m" x="1448" y="484">adapter-claude-code: session discovery + file-drop</text>
  <text class="m" x="1448" y="500">  decision delivery (.miniforge/inbox.jsonl)</text>
  <text class="m" x="1448" y="516">adapter-miniforge: event-stream → control-plane</text>
  <text class="s" x="1448" y="538" font-style="italic">inbox read-side normative only for claude-code — T3 #7</text>

  <rect class="note" x="976" y="578" width="910" height="86" rx="6"/>
  <text class="h" x="992" y="600">Consumer seam (details on A1)</text>
  <text class="t" x="992" y="620">thesium-workflows/career embed miniforge as a submodule: bb-utils + messages on Babashka for cheap paths; ai.miniforge/llm + the workflow</text>
  <text class="t" x="992" y="638">runtime on JVM for heavy paths (llm drags http-kit). miniforge-control consumes only the vendored contracts/ fixtures — it never links the</text>
  <text class="t" x="992" y="656">Clojure estate. These two seams are load points for the target architecture's console and Fleet planes.</text>

  <!-- legend -->
  <rect class="zone" x="20" y="700" width="1880" height="70" rx="6"/>
  <text class="zoneT" x="36" y="722">TYPES</text>
  <rect class="fs" x="40" y="736" width="26" height="16" rx="3"/><text class="s" x="74" y="748">filesystem / object-store state</text>
  <rect class="ct" x="290" y="736" width="26" height="16" rx="3"/><text class="s" x="324" y="748">formal contract artifact (Transit goldens)</text>
  <rect class="ig" x="610" y="736" width="26" height="16" rx="3"/><text class="s" x="644" y="748">external integration (shell-out / HTTP / MCP)</text>
</svg>
