<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Shared Deliberation — 3. Scoped information flow</title><desc id="desc">Ariadne §13.4 target: the board is a container. Actual reads create flows; the synthetic lab does not implement the general policy plane.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a76b8"/></marker></defs>
<rect width="1920" height="1120" fill="white"/>
<rect width="1920" height="65" fill="#1e5f96"/>
<text x="24" y="30" font-size="23" fill="white" font-weight="bold">Shared Deliberation — 3. Scoped information flow</text>
<text x="24" y="52" font-size="15" fill="#cfe2f3">Ariadne §13.4 target: the board is a container. Actual reads create flows; the synthetic lab does not implement the general policy plane.</text>
<rect x="24" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="42" y="113" font-size="18" fill="#1e5f96" font-weight="bold">PUBLIC BRANCH A</text>
<rect x="656" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="674" y="113" font-size="18" fill="#1e5f96" font-weight="bold">SHARED CONTAINER AND FLOW GATE</text>
<rect x="1288" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="1306" y="113" font-size="18" fill="#1e5f96" font-weight="bold">RESTRICTED BRANCH B</text>
<rect x="48" y="140" width="552" height="135" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="64" y="168" font-size="19" fill="#333" font-weight="bold">Public source A</text>
<text x="64" y="194" font-size="16" fill="#333" font-weight="normal">Labeled evidence selected for the public task. No</text>
<text x="64" y="217" font-size="16" fill="#333" font-weight="normal">restriction is inherited merely because B exists.</text>
<rect x="1312" y="140" width="552" height="135" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="1328" y="168" font-size="19" fill="#333" font-weight="bold">Restricted source B</text>
<text x="1328" y="194" font-size="16" fill="#333" font-weight="normal">Clauses retain each imposing authority: tenant, license,</text>
<text x="1328" y="217" font-size="16" fill="#333" font-weight="normal">purpose and allowed destinations.</text>
<rect x="48" y="330" width="552" height="135" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="64" y="358" font-size="19" fill="#333" font-weight="bold">Eligible provider A</text>
<text x="64" y="384" font-size="16" fill="#333" font-weight="normal">The model call is an egress event. Public-only inputs permit</text>
<text x="64" y="407" font-size="16" fill="#333" font-weight="normal">the corresponding provider binding.</text>
<rect x="1312" y="330" width="552" height="135" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="1328" y="358" font-size="19" fill="#333" font-weight="bold">Eligible provider B</text>
<text x="1328" y="384" font-size="16" fill="#333" font-weight="normal">Resolve retention, residency and training attributes. A</text>
<text x="1328" y="407" font-size="16" fill="#333" font-weight="normal">provider eligible for A can still be refused for B.</text>
<rect x="48" y="570" width="552" height="135" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="64" y="598" font-size="19" fill="#333" font-weight="bold">Contribution A</text>
<text x="64" y="624" font-size="16" fill="#333" font-weight="normal">Runtime derives its clauses from inputs actually delivered</text>
<text x="64" y="647" font-size="16" fill="#333" font-weight="normal">to A. The model cannot erase those clauses.</text>
<rect x="1312" y="570" width="552" height="135" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="1328" y="598" font-size="19" fill="#333" font-weight="bold">Contribution B</text>
<text x="1328" y="624" font-size="16" fill="#333" font-weight="normal">The derived contribution inherits B restrictions. A summary</text>
<text x="1328" y="647" font-size="16" fill="#333" font-weight="normal">cannot declassify its source.</text>
<rect x="680" y="140" width="552" height="135" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="696" y="168" font-size="19" fill="#333" font-weight="bold">No implicit cross-branch contamination</text>
<text x="696" y="194" font-size="16" fill="#333" font-weight="normal">Run-wide policy summary is only an audit upper bound. It is</text>
<text x="696" y="217" font-size="16" fill="#333" font-weight="normal">not the label applied to every contribution.</text>
<rect x="680" y="330" width="552" height="135" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="696" y="358" font-size="19" fill="#333" font-weight="bold">Authorize selected reads and provider egress</text>
<text x="696" y="384" font-size="16" fill="#333" font-weight="normal">The runtime gates object access, purpose and destination</text>
<text x="696" y="407" font-size="16" fill="#333" font-weight="normal">before sending inputs. Recheck on later reads and fallback</text>
<text x="696" y="430" font-size="16" fill="#333" font-weight="normal">routing.</text>
<rect x="680" y="525" width="552" height="205" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="696" y="553" font-size="19" fill="#333" font-weight="bold">Shared blackboard stores both contributions</text>
<text x="696" y="579" font-size="16" fill="#333" font-weight="normal">A and B retain distinct labels. Storage placement does not</text>
<text x="696" y="602" font-size="16" fill="#333" font-weight="normal">create a flow between their contents.</text>
<rect x="48" y="780" width="552" height="150" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="64" y="808" font-size="19" fill="#333" font-weight="bold">A remains public-only</text>
<text x="64" y="834" font-size="16" fill="#333" font-weight="normal">Until A reads B, B does not taint A. This is why selective</text>
<text x="64" y="857" font-size="16" fill="#333" font-weight="normal">projections matter to cost and model eligibility.</text>
<rect x="680" y="780" width="552" height="150" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="696" y="808" font-size="19" fill="#333" font-weight="bold">A later reads B</text>
<text x="696" y="834" font-size="16" fill="#333" font-weight="normal">Authorize that flow first. A later output then inherits the</text>
<text x="696" y="857" font-size="16" fill="#333" font-weight="normal">relevant restrictions. Only trusted transforms or scoped</text>
<text x="696" y="880" font-size="16" fill="#333" font-weight="normal">approval can relax a flow.</text>
<rect x="1312" y="780" width="552" height="150" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="1328" y="808" font-size="19" fill="#333" font-weight="bold">Pilot boundary</text>
<text x="1328" y="834" font-size="16" fill="#333" font-weight="normal">The CLI accepts only the two explicitly synthetic task</text>
<text x="1328" y="857" font-size="16" fill="#333" font-weight="normal">packages. General tenant, rights and destination enforcement</text>
<text x="1328" y="880" font-size="16" fill="#333" font-weight="normal">remain prerequisites.</text>
<path d="M324,278 L324,327" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M324,468 L324,567" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1588,278 L1588,327" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1588,468 L1588,567" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680,397 L602,397" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1234,397 L1308,397" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M602,640 L678,640" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1310,640 L1234,640" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M956,522 L956,468" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="990" width="22" height="18" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="58" y="1005" font-size="15" fill="#333" font-weight="normal">data</text>
<rect x="241" y="990" width="22" height="18" fill="#fff2cc" stroke="#d6b656"/>
<text x="273" y="1005" font-size="15" fill="#333" font-weight="normal">agent</text>
<rect x="456" y="990" width="22" height="18" fill="#e1d5e7" stroke="#9673a6"/>
<text x="488" y="1005" font-size="15" fill="#333" font-weight="normal">authority</text>
<rect x="671" y="990" width="22" height="18" fill="#d5e8d4" stroke="#82b366"/>
<text x="703" y="1005" font-size="15" fill="#333" font-weight="normal">runtime</text>
<rect x="886" y="990" width="22" height="18" fill="#ffe6cc" stroke="#d79b00"/>
<text x="918" y="1005" font-size="15" fill="#333" font-weight="normal">external</text>
<rect x="1101" y="990" width="22" height="18" fill="#f8cecc" stroke="#b85450"/>
<text x="1133" y="1005" font-size="15" fill="#333" font-weight="normal">risk</text>
<text x="26" y="1046" font-size="16" fill="#333" font-weight="normal">Source → eligible provider → contribution → shared storage → authorized later read. Placing B on the board does not disclose it to A. A required constraint that cannot be disclosed</text>
<text x="26" y="1069" font-size="16" fill="#333" font-weight="normal">requires authorized reformulation or refusal.</text>
<text x="26" y="1102" font-size="13" fill="#666" font-weight="normal">Miniforge • N14 / N15 revision • Ariadne v1.6.1 • Copyright 2025–2026 Christopher Lester • Apache 2.0</text>
</svg>
