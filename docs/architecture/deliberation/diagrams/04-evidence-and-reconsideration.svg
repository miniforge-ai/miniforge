<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Shared Deliberation — 4. Revisable conclusions and scientific work</title><desc id="desc">Structural validation is not a truth oracle. Adoption records a working choice; new evidence may require reconsideration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a76b8"/></marker></defs>
<rect width="1920" height="1120" fill="white"/>
<rect width="1920" height="65" fill="#1e5f96"/>
<text x="24" y="30" font-size="23" fill="white" font-weight="bold">Shared Deliberation — 4. Revisable conclusions and scientific work</text>
<text x="24" y="52" font-size="15" fill="#cfe2f3">Structural validation is not a truth oracle. Adoption records a working choice; new evidence may require reconsideration.</text>
<rect x="24" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="42" y="113" font-size="18" fill="#1e5f96" font-weight="bold">CONSTRUCT THE PROBLEM</text>
<rect x="48" y="140" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="64" y="168" font-size="19" fill="#333" font-weight="bold">Goal + constraints</text>
<text x="64" y="194" font-size="16" fill="#333" font-weight="normal">Task specification supplies the frame. Agents may propose</text>
<text x="64" y="217" font-size="16" fill="#333" font-weight="normal">soft constraints; hard constraints need an established spec</text>
<text x="64" y="240" font-size="16" fill="#333" font-weight="normal">source.</text>
<path d="M324,308 L324,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="338" width="552" height="166" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="64" y="366" font-size="19" fill="#333" font-weight="bold">Claim + alternative hypothesis</text>
<text x="64" y="392" font-size="16" fill="#333" font-weight="normal">State an assumption or mechanism; link the competing</text>
<text x="64" y="415" font-size="16" fill="#333" font-weight="normal">interpretation. Prefer specific statements that can be</text>
<text x="64" y="438" font-size="16" fill="#333" font-weight="normal">tested.</text>
<path d="M324,506 L324,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="536" width="552" height="166" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="64" y="564" font-size="19" fill="#333" font-weight="bold">Actionable challenge</text>
<text x="64" y="590" font-size="16" fill="#333" font-weight="normal">Name the concern and what would resolve it. Existing</text>
<text x="64" y="613" font-size="16" fill="#333" font-weight="normal">evidence or an experiment can back it; a useful question is</text>
<text x="64" y="636" font-size="16" fill="#333" font-weight="normal">allowed.</text>
<path d="M324,704 L324,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="734" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="64" y="762" font-size="19" fill="#333" font-weight="bold">Bounded experiment proposal</text>
<text x="64" y="788" font-size="16" fill="#333" font-weight="normal">Choose a synthetic evidence fixture in the pilot. General</text>
<text x="64" y="811" font-size="16" fill="#333" font-weight="normal">experiments later use governed capsules and runtime</text>
<text x="64" y="834" font-size="16" fill="#333" font-weight="normal">receipts.</text>
<rect x="656" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="674" y="113" font-size="18" fill="#1e5f96" font-weight="bold">TEST AND REVISE</text>
<rect x="680" y="140" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="696" y="168" font-size="19" fill="#333" font-weight="bold">Runtime observation</text>
<text x="696" y="194" font-size="16" fill="#333" font-weight="normal">An allowlisted reader emits a receipt. Source class,</text>
<text x="696" y="217" font-size="16" fill="#333" font-weight="normal">evidence text and receipt identity originate outside the</text>
<text x="696" y="240" font-size="16" fill="#333" font-weight="normal">model.</text>
<path d="M956,308 L956,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="338" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="696" y="366" font-size="19" fill="#333" font-weight="bold">Update the shared model</text>
<text x="696" y="392" font-size="16" fill="#333" font-weight="normal">Refine a statement with retained history; answer a question;</text>
<text x="696" y="415" font-size="16" fill="#333" font-weight="normal">attach evidence; identify explicit contradictions.</text>
<path d="M956,506 L956,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="536" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="696" y="564" font-size="19" fill="#333" font-weight="bold">Adopt a scoped decision</text>
<text x="696" y="590" font-size="16" fill="#333" font-weight="normal">One current decision per choice point. Adoption can retain</text>
<text x="696" y="613" font-size="16" fill="#333" font-weight="normal">dissent; it never proves every assumption or authorizes an</text>
<text x="696" y="636" font-size="16" fill="#333" font-weight="normal">effect.</text>
<path d="M956,704 L956,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="734" width="552" height="166" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="696" y="762" font-size="19" fill="#333" font-weight="bold">Reconsider when evidence changes</text>
<text x="696" y="788" font-size="16" fill="#333" font-weight="normal">Challenge an adopted decision without deleting it. Supersede</text>
<text x="696" y="811" font-size="16" fill="#333" font-weight="normal">it explicitly before adopting an incompatible replacement.</text>
<rect x="1288" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="1306" y="113" font-size="18" fill="#1e5f96" font-weight="bold">PRESERVE THE DECISION RECORD</text>
<rect x="1312" y="140" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="1328" y="168" font-size="19" fill="#333" font-weight="bold">Accepted record + open dissent</text>
<text x="1328" y="194" font-size="16" fill="#333" font-weight="normal">The accepted record stays identifiable; contested status is</text>
<text x="1328" y="217" font-size="16" fill="#333" font-weight="normal">recorded separately. No history rewrite to make consensus</text>
<text x="1328" y="240" font-size="16" fill="#333" font-weight="normal">appear unanimous.</text>
<path d="M1588,308 L1588,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="338" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="1328" y="366" font-size="19" fill="#333" font-weight="bold">Supersession and conflict history</text>
<text x="1328" y="392" font-size="16" fill="#333" font-weight="normal">Replacement references explain why the earlier choice no</text>
<text x="1328" y="415" font-size="16" fill="#333" font-weight="normal">longer applies. Resolved conflicts remain inspectable.</text>
<path d="M1588,506 L1588,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="536" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="1328" y="564" font-size="19" fill="#333" font-weight="bold">Closure outcome</text>
<text x="1328" y="590" font-size="16" fill="#333" font-weight="normal">Completed goals, rejected goals, budget boundary, deadlock</text>
<text x="1328" y="613" font-size="16" fill="#333" font-weight="normal">and stop are distinct. Closure is not automatically task</text>
<text x="1328" y="636" font-size="16" fill="#333" font-weight="normal">success.</text>
<path d="M1588,704 L1588,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="734" width="552" height="166" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="1328" y="762" font-size="19" fill="#333" font-weight="bold">Sealed post-run evaluation</text>
<text x="1328" y="788" font-size="16" fill="#333" font-weight="normal">Scoring evaluates final observable choices and consulted</text>
<text x="1328" y="811" font-size="16" fill="#333" font-weight="normal">evidence. Participants do not receive reference answers or</text>
<text x="1328" y="834" font-size="16" fill="#333" font-weight="normal">scores.</text>
<rect x="26" y="990" width="22" height="18" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="58" y="1005" font-size="15" fill="#333" font-weight="normal">data</text>
<rect x="241" y="990" width="22" height="18" fill="#fff2cc" stroke="#d6b656"/>
<text x="273" y="1005" font-size="15" fill="#333" font-weight="normal">agent</text>
<rect x="456" y="990" width="22" height="18" fill="#e1d5e7" stroke="#9673a6"/>
<text x="488" y="1005" font-size="15" fill="#333" font-weight="normal">authority</text>
<rect x="671" y="990" width="22" height="18" fill="#d5e8d4" stroke="#82b366"/>
<text x="703" y="1005" font-size="15" fill="#333" font-weight="normal">runtime</text>
<rect x="886" y="990" width="22" height="18" fill="#ffe6cc" stroke="#d79b00"/>
<text x="918" y="1005" font-size="15" fill="#333" font-weight="normal">external</text>
<rect x="1101" y="990" width="22" height="18" fill="#f8cecc" stroke="#b85450"/>
<text x="1133" y="1005" font-size="15" fill="#333" font-weight="normal">risk</text>
<text x="26" y="1046" font-size="16" fill="#333" font-weight="normal">The development fixtures test policy design choices, not production artifacts. N15 promotion additionally requires long-horizon tasks, sealed executable acceptance suites, calibration,</text>
<text x="26" y="1069" font-size="16" fill="#333" font-weight="normal">independent scoring and matched-budget controls.</text>
<text x="26" y="1102" font-size="13" fill="#666" font-weight="normal">Miniforge • N14 / N15 revision • Ariadne v1.6.1 • Copyright 2025–2026 Christopher Lester • Apache 2.0</text>
</svg>
