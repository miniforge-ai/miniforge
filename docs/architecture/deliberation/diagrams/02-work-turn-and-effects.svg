<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Shared Deliberation — 2. One work turn and its trust boundaries</title><desc id="desc">Models contribute payloads. The runtime controls identity, admission, authoritative state and receipts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a76b8"/></marker></defs>
<rect width="1920" height="1120" fill="white"/>
<rect width="1920" height="65" fill="#1e5f96"/>
<text x="24" y="30" font-size="23" fill="white" font-weight="bold">Shared Deliberation — 2. One work turn and its trust boundaries</text>
<text x="24" y="52" font-size="15" fill="#cfe2f3">Models contribute payloads. The runtime controls identity, admission, authoritative state and receipts.</text>
<rect x="24" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="42" y="113" font-size="18" fill="#1e5f96" font-weight="bold">INPUT AND ACTIVATION</text>
<rect x="48" y="140" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="64" y="168" font-size="19" fill="#333" font-weight="bold">1 · Select participant and allowance</text>
<text x="64" y="194" font-size="16" fill="#333" font-weight="normal">Fixed schedule in the lab; stable participant identity</text>
<text x="64" y="217" font-size="16" fill="#333" font-weight="normal">separate from responsibility. Final synthesis is inside the</text>
<text x="64" y="240" font-size="16" fill="#333" font-weight="normal">total allowance.</text>
<path d="M324,308 L324,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="338" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="64" y="366" font-size="19" fill="#333" font-weight="bold">2 · Build the task view</text>
<text x="64" y="392" font-size="16" fill="#333" font-weight="normal">Goals plus relevant objects and prior commit feedback. No</text>
<text x="64" y="415" font-size="16" fill="#333" font-weight="normal">raw workspace, sealed score, peer activation metadata or</text>
<text x="64" y="438" font-size="16" fill="#333" font-weight="normal">arbitrary tool access.</text>
<path d="M324,506 L324,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="536" width="552" height="166" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="64" y="564" font-size="19" fill="#333" font-weight="bold">3 · Fresh provider invocation</text>
<text x="64" y="590" font-size="16" fill="#333" font-weight="normal">Isolated, tool-free llm client call. Synthetic-only input.</text>
<text x="64" y="613" font-size="16" fill="#333" font-weight="normal">Observed usage, or unknown usage on failure, is recorded.</text>
<path d="M324,704 L324,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="734" width="552" height="166" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="64" y="762" font-size="19" fill="#333" font-weight="bold">4 · Untrusted proposal</text>
<text x="64" y="788" font-size="16" fill="#333" font-weight="normal">Operations plus optional synthetic fixture inspections.</text>
<text x="64" y="811" font-size="16" fill="#333" font-weight="normal">Unknown fields, evidence classes and authority claims cannot</text>
<text x="64" y="834" font-size="16" fill="#333" font-weight="normal">confer permission.</text>
<rect x="656" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="674" y="113" font-size="18" fill="#1e5f96" font-weight="bold">ATOMIC REASONING COMMIT</text>
<rect x="680" y="140" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="696" y="168" font-size="19" fill="#333" font-weight="bold">5 · Stamp trusted identity</text>
<text x="696" y="194" font-size="16" fill="#333" font-weight="normal">Role mismatch is rejected. Runtime supplies actor,</text>
<text x="696" y="217" font-size="16" fill="#333" font-weight="normal">activation and current basis; model identity fields are not</text>
<text x="696" y="240" font-size="16" fill="#333" font-weight="normal">authoritative.</text>
<path d="M956,308 L956,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="338" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="696" y="366" font-size="19" fill="#333" font-weight="bold">6 · Validate the entire candidate</text>
<text x="696" y="392" font-size="16" fill="#333" font-weight="normal">Shape, types, provenance receipts, references, choice</text>
<text x="696" y="415" font-size="16" fill="#333" font-weight="normal">points, hard-constraint rules and duplicate payload checks.</text>
<text x="696" y="438" font-size="16" fill="#333" font-weight="normal">No partial state escapes.</text>
<path d="M956,506 L956,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="536" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="696" y="564" font-size="19" fill="#333" font-weight="bold">7 · Commit and derive</text>
<text x="696" y="590" font-size="16" fill="#333" font-weight="normal">One version per atomic transaction. Recompute explicit</text>
<text x="696" y="613" font-size="16" fill="#333" font-weight="normal">conflicts. Return committed/rejected feedback to the next</text>
<text x="696" y="636" font-size="16" fill="#333" font-weight="normal">turn.</text>
<path d="M956,704 L956,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="734" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="696" y="762" font-size="19" fill="#333" font-weight="bold">8 · Persist before continuing</text>
<text x="696" y="788" font-size="16" fill="#333" font-weight="normal">Force immutable hash-chained journal record before the next</text>
<text x="696" y="811" font-size="16" fill="#333" font-weight="normal">call. Replay reconstructs the object graph. Report is a</text>
<text x="696" y="834" font-size="16" fill="#333" font-weight="normal">derived view.</text>
<rect x="1288" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="1306" y="113" font-size="18" fill="#1e5f96" font-weight="bold">EFFECT BOUNDARY</text>
<rect x="1312" y="140" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="1328" y="168" font-size="19" fill="#333" font-weight="bold">A decision on the board</text>
<text x="1328" y="194" font-size="16" fill="#333" font-weight="normal">A chosen alternative and its rationale, evidence, dissent</text>
<text x="1328" y="217" font-size="16" fill="#333" font-weight="normal">and unresolved assumptions. This is a reasoning record.</text>
<path d="M1588,308 L1588,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="338" width="552" height="166" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="1328" y="366" font-size="19" fill="#333" font-weight="bold">An exact effect proposal</text>
<text x="1328" y="392" font-size="16" fill="#333" font-weight="normal">Canonical arguments, binding, labeled inputs and</text>
<text x="1328" y="415" font-size="16" fill="#333" font-weight="normal">destination. Never execute by interpreting a decision</text>
<text x="1328" y="438" font-size="16" fill="#333" font-weight="normal">statement as a command.</text>
<path d="M1588,506 L1588,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="536" width="552" height="166" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="1328" y="564" font-size="19" fill="#333" font-weight="bold">Ariadne decision envelope</text>
<text x="1328" y="590" font-size="16" fill="#333" font-weight="normal">Authority, flow and impact checks. Exact approval hash when</text>
<text x="1328" y="613" font-size="16" fill="#333" font-weight="normal">required; current grant and freshness checks at commit.</text>
<path d="M1588,704 L1588,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="734" width="552" height="166" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="1328" y="762" font-size="19" fill="#333" font-weight="bold">Effect receipt back to the board</text>
<text x="1328" y="788" font-size="16" fill="#333" font-weight="normal">Succeeded, failed or unknown outcome; reconcile with the</text>
<text x="1328" y="811" font-size="16" fill="#333" font-weight="normal">external system. General effects are outside this synthetic</text>
<text x="1328" y="834" font-size="16" fill="#333" font-weight="normal">pilot.</text>
<rect x="26" y="990" width="22" height="18" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="58" y="1005" font-size="15" fill="#333" font-weight="normal">data</text>
<rect x="241" y="990" width="22" height="18" fill="#fff2cc" stroke="#d6b656"/>
<text x="273" y="1005" font-size="15" fill="#333" font-weight="normal">agent</text>
<rect x="456" y="990" width="22" height="18" fill="#e1d5e7" stroke="#9673a6"/>
<text x="488" y="1005" font-size="15" fill="#333" font-weight="normal">authority</text>
<rect x="671" y="990" width="22" height="18" fill="#d5e8d4" stroke="#82b366"/>
<text x="703" y="1005" font-size="15" fill="#333" font-weight="normal">runtime</text>
<rect x="886" y="990" width="22" height="18" fill="#ffe6cc" stroke="#d79b00"/>
<text x="918" y="1005" font-size="15" fill="#333" font-weight="normal">external</text>
<rect x="1101" y="990" width="22" height="18" fill="#f8cecc" stroke="#b85450"/>
<text x="1133" y="1005" font-size="15" fill="#333" font-weight="normal">risk</text>
<text x="26" y="1046" font-size="16" fill="#333" font-weight="normal">The pilot has no merge, deploy or arbitrary execution capability. Fixture inspection is an allowlisted runtime reader that produces synthetic execution receipts. A model saying that a</text>
<text x="26" y="1069" font-size="16" fill="#333" font-weight="normal">test passed is only an assertion.</text>
<text x="26" y="1102" font-size="13" fill="#666" font-weight="normal">Miniforge • N14 / N15 revision • Ariadne v1.6.1 • Copyright 2025–2026 Christopher Lester • Apache 2.0</text>
</svg>
