<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Shared Deliberation — 5. Experiment topology and promotion</title><desc id="desc">The lab is runnable now. Its controls approximate the questions in N15 without claiming G0 compliance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a76b8"/></marker></defs>
<rect width="1920" height="1120" fill="white"/>
<rect width="1920" height="65" fill="#1e5f96"/>
<text x="24" y="30" font-size="23" fill="white" font-weight="bold">Shared Deliberation — 5. Experiment topology and promotion</text>
<text x="24" y="52" font-size="15" fill="#cfe2f3">The lab is runnable now. Its controls approximate the questions in N15 without claiming G0 compliance.</text>
<rect x="24" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="42" y="113" font-size="18" fill="#1e5f96" font-weight="bold">DEVELOPMENT CONDITIONS</text>
<rect x="48" y="140" width="552" height="166" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="64" y="168" font-size="19" fill="#333" font-weight="bold">Single participant</text>
<text x="64" y="194" font-size="16" fill="#333" font-weight="normal">One participant repeatedly works on its own typed state.</text>
<text x="64" y="217" font-size="16" fill="#333" font-weight="normal">This is not N15 C1 continuous-session conformance.</text>
<path d="M324,308 L324,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="338" width="552" height="166" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="64" y="366" font-size="19" fill="#333" font-weight="bold">Independent attempts + selection</text>
<text x="64" y="392" font-size="16" fill="#333" font-weight="normal">Fresh private attempts; one metered final selector sees</text>
<text x="64" y="415" font-size="16" fill="#333" font-weight="normal">their submitted solutions and rationales.</text>
<path d="M324,506 L324,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="536" width="552" height="166" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="64" y="564" font-size="19" fill="#333" font-weight="bold">Relay</text>
<text x="64" y="590" font-size="16" fill="#333" font-weight="normal">Private typed state per participant, with prior solutions</text>
<text x="64" y="613" font-size="16" fill="#333" font-weight="normal">and rationales passed in sequence. No shared graph.</text>
<path d="M324,704 L324,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="734" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="64" y="762" font-size="19" fill="#333" font-weight="bold">Shared board / blinded board</text>
<text x="64" y="788" font-size="16" fill="#333" font-weight="normal">Same fixed population and activation schedule. Shared</text>
<text x="64" y="811" font-size="16" fill="#333" font-weight="normal">condition uses one graph; blind condition uses isolated per-</text>
<text x="64" y="834" font-size="16" fill="#333" font-weight="normal">participant graphs.</text>
<rect x="656" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="674" y="113" font-size="18" fill="#1e5f96" font-weight="bold">ISOLATION AND MEASUREMENT</text>
<rect x="680" y="140" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="696" y="168" font-size="19" fill="#333" font-weight="bold">Pinned experiment identity</text>
<text x="696" y="194" font-size="16" fill="#333" font-weight="normal">Manifest, prompt and task hashes; exact model name;</text>
<text x="696" y="217" font-size="16" fill="#333" font-weight="normal">normalized price weights; tiers and replicate identity.</text>
<path d="M956,308 L956,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="338" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="696" y="366" font-size="19" fill="#333" font-weight="bold">One total turn allowance</text>
<text x="696" y="392" font-size="16" fill="#333" font-weight="normal">Final synthesis / selection is included. Observed provider</text>
<text x="696" y="415" font-size="16" fill="#333" font-weight="normal">usage, normalized cost, failed calls and failed cells are</text>
<text x="696" y="438" font-size="16" fill="#333" font-weight="normal">recorded.</text>
<path d="M956,506 L956,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="536" width="552" height="166" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="696" y="564" font-size="19" fill="#333" font-weight="bold">No blind side channels</text>
<text x="696" y="590" font-size="16" fill="#333" font-weight="normal">Separate graphs prevent peer status, global versions,</text>
<text x="696" y="613" font-size="16" fill="#333" font-weight="normal">validation outcomes and scheduler changes reaching blind</text>
<text x="696" y="636" font-size="16" fill="#333" font-weight="normal">participants.</text>
<path d="M956,704 L956,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="734" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="696" y="762" font-size="19" fill="#333" font-weight="bold">Journal → replay → report</text>
<text x="696" y="788" font-size="16" fill="#333" font-weight="normal">Every activation is durable before continuing. Report</text>
<text x="696" y="811" font-size="16" fill="#333" font-weight="normal">success counts and paired shared-minus-blind deltas; no</text>
<text x="696" y="834" font-size="16" fill="#333" font-weight="normal">significance claim.</text>
<rect x="1288" y="84" width="600" height="882" rx="8" fill="#fcfcfa" stroke="#b8b8b0"/>
<text x="1306" y="113" font-size="18" fill="#1e5f96" font-weight="bold">GATE-QUALITY EXPERIMENT / NEXT</text>
<rect x="1312" y="140" width="552" height="166" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="1328" y="168" font-size="19" fill="#333" font-weight="bold">1 · Calibrate conforming tasks</text>
<text x="1328" y="194" font-size="16" fill="#333" font-weight="normal">Long-horizon seeded repositories; reference passes and</text>
<text x="1328" y="217" font-size="16" fill="#333" font-weight="normal">distractors fail sealed tests; baselines neither saturate</text>
<text x="1328" y="240" font-size="16" fill="#333" font-weight="normal">nor floor.</text>
<path d="M1588,308 L1588,334" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="338" width="552" height="166" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="1328" y="366" font-size="19" fill="#333" font-weight="bold">2 · Complete controls + budgets</text>
<text x="1328" y="392" font-size="16" fill="#333" font-weight="normal">Full N15 C1/C2/C4 and C6/C7 semantics; hard total cost</text>
<text x="1328" y="415" font-size="16" fill="#333" font-weight="normal">enforcement; provider and context-policy integration.</text>
<path d="M1588,506 L1588,532" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="536" width="552" height="166" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="1328" y="564" font-size="19" fill="#333" font-weight="bold">3 · Preregister paired comparison</text>
<text x="1328" y="590" font-size="16" fill="#333" font-weight="normal">Pin effect margins, replicate count and uncertainty method.</text>
<text x="1328" y="613" font-size="16" fill="#333" font-weight="normal">All closing passes consume the same total allowance.</text>
<path d="M1588,704 L1588,730" fill="none" stroke="#3a76b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1312" y="734" width="552" height="166" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="1328" y="762" font-size="19" fill="#333" font-weight="bold">4 · Evaluate the tested version</text>
<text x="1328" y="788" font-size="16" fill="#333" font-weight="normal">Report positive, null, or negative results with identical</text>
<text x="1328" y="811" font-size="16" fill="#333" font-weight="normal">rigor. A negative result rejects this configuration, not</text>
<text x="1328" y="834" font-size="16" fill="#333" font-weight="normal">every future shared-state design.</text>
<rect x="26" y="990" width="22" height="18" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="58" y="1005" font-size="15" fill="#333" font-weight="normal">data</text>
<rect x="241" y="990" width="22" height="18" fill="#fff2cc" stroke="#d6b656"/>
<text x="273" y="1005" font-size="15" fill="#333" font-weight="normal">agent</text>
<rect x="456" y="990" width="22" height="18" fill="#e1d5e7" stroke="#9673a6"/>
<text x="488" y="1005" font-size="15" fill="#333" font-weight="normal">authority</text>
<rect x="671" y="990" width="22" height="18" fill="#d5e8d4" stroke="#82b366"/>
<text x="703" y="1005" font-size="15" fill="#333" font-weight="normal">runtime</text>
<rect x="886" y="990" width="22" height="18" fill="#ffe6cc" stroke="#d79b00"/>
<text x="918" y="1005" font-size="15" fill="#333" font-weight="normal">external</text>
<rect x="1101" y="990" width="22" height="18" fill="#f8cecc" stroke="#b85450"/>
<text x="1133" y="1005" font-size="15" fill="#333" font-weight="normal">risk</text>
<text x="26" y="1046" font-size="16" fill="#333" font-weight="normal">Included development matrix: 2 synthetic tasks × 5 conditions × 2 allowance tiers × 3 replicates = 60 cells, 510 planned activations. Offline mock runs test mechanics only. Every</text>
<text x="26" y="1069" font-size="16" fill="#333" font-weight="normal">current report says G0: NOT EVALUATED.</text>
<text x="26" y="1102" font-size="13" fill="#666" font-weight="normal">Miniforge • N14 / N15 revision • Ariadne v1.6.1 • Copyright 2025–2026 Christopher Lester • Apache 2.0</text>
</svg>
