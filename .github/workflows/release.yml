name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (DateVer: YYYY.MM.DD.N)'
        required: true
        type: string

# Read-only by default. Only the `release` job, which creates the tag and
# GitHub release, gets `contents: write`; the Homebrew and Scoop jobs
# push with their own GitHub App tokens.
permissions:
  contents: read

env:
  # Public identifier for the read-only Miniforge CI GitHub App (the one
  # ci.yml uses); credentials remain in MINIFORGE_CI_BOT_KEY. The CLI build
  # resolves the private miniforge-ai/workbench-contract git dependency.
  MINIFORGE_CI_BOT_APP_ID: "3360143"

jobs:
  # Refuses to release a commit that is not on main, or whose newest
  # ci.yml push run on main did not pass. Tag pushes and manual
  # dispatches both release github.sha. `bb release` (tasks/release.clj)
  # applies the same CI rule before it tags. No checkout or toolchain:
  # `gh` is preinstalled on the runner.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - name: Commit is on main
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)
          case "$status" in
            identical|behind) echo "$SHA is on main (compare status: $status)." ;;
            *) echo "::error::$SHA is not on main (compare status: $status); refusing to release."
               exit 1 ;;
          esac

      # Waits while CI is still running (a tag pushed right after a
      # merge), up to 40 minutes; a commit with no CI run gets 3 minutes
      # for the run to appear (only the tip of each push to main gets one).
      - name: CI passed for this commit
        run: |
          start=$(date +%s)
          while :; do
            newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=100" \
              --jq 'if (.workflow_runs | length) == 0 then "none" else (.workflow_runs | sort_by(.id) | last | "\(.status) \(.conclusion) \(.html_url)") end')
            echo "Newest ci.yml push run for $SHA: $newest"
            elapsed=$(( $(date +%s) - start ))
            case "$newest" in
              "completed success "*)
                exit 0 ;;
              completed\ *)
                echo "::error::ci.yml did not pass for $SHA; refusing to release."
                exit 1 ;;
              none)
                if (( elapsed >= 180 )); then
                  echo "::error::No ci.yml push run on main for $SHA; refusing to release."
                  exit 1
                fi ;;
              *)
                if (( elapsed >= 2400 )); then
                  echo "::error::ci.yml still running for $SHA after 40 minutes; re-run this workflow once it passes."
                  exit 1
                fi ;;
            esac
            sleep 30
          done

  # Resolves the release version once, before any build, so every
  # artifact is stamped with it (MINIFORGE_VERSION -> miniforge/version.edn
  # in the jar, read by `mf version`).
  version:
    name: Determine version
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      # The dispatch input reaches the shell through env, not expression
      # interpolation, and must be DateVer before any job uses it: every
      # later job reads the version from this job's outputs.
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            RELEASE_TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not DateVer (YYYY.MM.DD.N); refusing to release."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Release tag: $RELEASE_TAG"

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate workbench contract token
        id: workbench-contract-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ env.MINIFORGE_CI_BOT_APP_ID }}
          private-key: ${{ secrets.MINIFORGE_CI_BOT_KEY }}
          owner: miniforge-ai
          repositories: workbench-contract

      - name: Configure workbench contract access
        env:
          WORKBENCH_CONTRACT_TOKEN: ${{ steps.workbench-contract-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${WORKBENCH_CONTRACT_TOKEN}@github.com/miniforge-ai/workbench-contract.git".insteadOf "ssh://git@github.com/miniforge-ai/workbench-contract.git"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@bc7570e912b028bbcc22f457adec7fdf98e2f4ed # 12.5
        with:
          cli: latest
          bb: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', '**/deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Build uberscript
        env:
          MINIFORGE_VERSION: ${{ needs.version.outputs.version }}
        run: bb build:cli

      - name: Smoke-test the built jar
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out=$(bb --jar dist/miniforge.jar -m ai.miniforge.cli.main version)
          echo "$out"
          first=$(head -n1 <<<"$out")
          if [[ "$first" != *" $VERSION" ]]; then
            echo "::error::Built jar reports '$first'; expected version $VERSION."
            exit 1
          fi

      - name: Create artifact name
        id: artifact
        run: |
          ARTIFACT_NAME="miniforge-${{ matrix.os }}-${{ matrix.arch }}"
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Rename binary
        run: |
          cp dist/miniforge.jar dist/${{ steps.artifact.outputs.name }}

      - name: Generate SHA256 checksum
        run: |
          cd dist
          shasum -a 256 ${{ steps.artifact.outputs.name }} > ${{ steps.artifact.outputs.name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/${{ steps.artifact.outputs.name }}
            dist/${{ steps.artifact.outputs.name }}.sha256
          retention-days: 5

  # Windows is a preview artifact: packaged as a zip containing the
  # JVM-portable miniforge.jar + an mf.cmd launcher that defers to bb on
  # the user's PATH (installed via scoop). continue-on-error keeps the
  # release pipeline green while the Windows path is still in beta —
  # see docs/platform-support.md.
  build-windows:
    name: Build windows-x86_64 (preview)
    needs: version
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate workbench contract token
        id: workbench-contract-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ env.MINIFORGE_CI_BOT_APP_ID }}
          private-key: ${{ secrets.MINIFORGE_CI_BOT_KEY }}
          owner: miniforge-ai
          repositories: workbench-contract

      - name: Configure workbench contract access
        shell: bash
        env:
          WORKBENCH_CONTRACT_TOKEN: ${{ steps.workbench-contract-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${WORKBENCH_CONTRACT_TOKEN}@github.com/miniforge-ai/workbench-contract.git".insteadOf "ssh://git@github.com/miniforge-ai/workbench-contract.git"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clojure + bb (Windows)
        uses: DeLaGuardo/setup-clojure@bc7570e912b028bbcc22f457adec7fdf98e2f4ed # 12.5
        with:
          cli: latest
          bb: latest

      # `bb build:cli` shells out to `clojure` through Java
      # ProcessBuilder. On GitHub-hosted Windows runners setup-clojure
      # exposes the Clojure CLI as a PowerShell module, not a real
      # executable, so install deps.clj as clojure.exe / clj.exe.
      - name: Install deps.clj shim (Windows)
        shell: pwsh
        run: |
          $toolVersions = Get-Content -Raw ".github/tool-versions.json" | ConvertFrom-Json
          $depsVersion = $toolVersions.'deps-clj'
          $depsDir = "$env:USERPROFILE\.deps-clj"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/borkdude/deps.clj/releases/download/v${depsVersion}/deps.clj-${depsVersion}-windows-amd64.zip" `
            -OutFile deps.zip
          Expand-Archive deps.zip -DestinationPath $depsDir -Force
          Copy-Item "$depsDir\deps.exe" "$depsDir\clojure.exe"
          Copy-Item "$depsDir\deps.exe" "$depsDir\clj.exe"
          "$depsDir" >> $env:GITHUB_PATH
          Write-Host "clojure/clj installed at $depsDir (via deps.clj $depsVersion)"

      - name: Cache Clojure dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', '**/deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Build uberjar
        env:
          MINIFORGE_VERSION: ${{ needs.version.outputs.version }}
        run: bb build:cli
        shell: pwsh

      - name: Smoke-test the built jar
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $out = @(bb --jar dist/miniforge.jar -m ai.miniforge.cli.main version)
          $out
          if ($LASTEXITCODE -ne 0 -or -not $out[0].EndsWith(" $env:VERSION")) {
            Write-Error "Built jar reports '$($out[0])'; expected version $env:VERSION."
            exit 1
          }

      - name: Package zip with mf.cmd launcher
        shell: pwsh
        run: |
          $name = "miniforge-windows-x86_64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/miniforge.jar "$stage/miniforge.jar"
          @"
          @echo off
          bb --jar "%~dp0miniforge.jar" -m ai.miniforge.cli.main %*
          "@ | Out-File -Encoding ascii "$stage/mf.cmd"
          $zip = "dist/$name.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$sha  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miniforge-windows-x86_64
          path: |
            dist/miniforge-windows-x86_64.zip
            dist/miniforge-windows-x86_64.zip.sha256
          retention-days: 5

  release:
    name: Create GitHub Release
    # Wait on both, but allow release to ship even if the Windows preview
    # build fails — Mac/Linux builds remain the gating dependency.
    needs: [version, build, build-windows]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version.outputs.version }}
      release_tag: ${{ needs.version.outputs.release_tag }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -name 'miniforge-*' -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          # A dispatch creates the tag; point it at the gated, built
          # commit rather than wherever main is by now.
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
          generate_release_notes: true
          body: |
            ## Miniforge ${{ needs.version.outputs.version }}

            ### Installation

            #### Homebrew (macOS and Linux)
            ```bash
            brew install miniforge-ai/tap/miniforge
            ```

            #### Direct download
            Download the binary for your platform from the assets below, make it executable, and move it to your PATH:

            **macOS ARM64 (Apple Silicon)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}/miniforge-macos-arm64 -o miniforge
            chmod +x miniforge
            sudo mv miniforge /usr/local/bin/
            ```

            **Linux x86_64**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}/miniforge-linux-x86_64 -o miniforge
            chmod +x miniforge
            sudo mv miniforge /usr/local/bin/
            ```

            **Windows x86_64 (preview)**

            Requires `bb.exe` on PATH (`scoop install babashka` — see the
            [Platform Support](https://github.com/${{ github.repository }}/blob/main/docs/platform-support.md)
            page). The Windows artifact may be missing if the preview build
            failed — check the assets list below.
            ```powershell
            Invoke-WebRequest -Uri https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}/miniforge-windows-x86_64.zip -OutFile miniforge.zip
            Expand-Archive miniforge.zip -DestinationPath $env:LOCALAPPDATA\Programs\miniforge
            $env:PATH += ";$env:LOCALAPPDATA\Programs\miniforge"
            mf version
            ```

            ### Verification
            Verify the installation:
            ```bash
            mf version
            ```

            ### Changes
            See the release notes below for details.

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: miniforge-ai
          repositories: homebrew-tap

      - name: Checkout homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: miniforge-ai/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: miniforge-macos-arm64
          path: artifacts/macos-arm64

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: miniforge-linux-x86_64
          path: artifacts/linux-x86_64

      - name: Generate formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Read SHA256 checksums
          MACOS_ARM64_SHA=$(cat artifacts/macos-arm64/miniforge-macos-arm64.sha256 | awk '{print $1}')
          LINUX_X86_SHA=$(cat artifacts/linux-x86_64/miniforge-linux-x86_64.sha256 | awk '{print $1}')

          # Create Formula directory if it doesn't exist
          mkdir -p homebrew-tap/Formula

          cat > homebrew-tap/Formula/miniforge.rb << 'FORMULA_EOF'
          class Miniforge < Formula
            desc "Autonomous software factory — built on MiniForge Core"
            homepage "https://miniforge.ai"
            version "RELEASE_VERSION"
            license "Apache-2.0"

            on_macos do
              url "https://github.com/miniforge-ai/miniforge/releases/download/vRELEASE_VERSION/miniforge-macos-arm64"
              sha256 "MACOS_SHA_PLACEHOLDER"
            end

            on_linux do
              url "https://github.com/miniforge-ai/miniforge/releases/download/vRELEASE_VERSION/miniforge-linux-x86_64"
              sha256 "LINUX_SHA_PLACEHOLDER"
            end

            depends_on "babashka"

            def install
              jar_name = "miniforge.jar"
              if OS.mac?
                libexec.install "miniforge-macos-arm64" => jar_name
              else
                libexec.install "miniforge-linux-x86_64" => jar_name
              end

              (bin/"mf").write <<~SH
                #!/bin/bash
                exec bb --jar "#{libexec}/#{jar_name}" -m ai.miniforge.cli.main "$@"
              SH
            end

            test do
              assert_match "miniforge", shell_output("#{bin}/mf --help 2>&1")
            end
          end
          FORMULA_EOF

          # Substitute version and checksums
          sed -i "s/RELEASE_VERSION/${VERSION}/g" homebrew-tap/Formula/miniforge.rb
          sed -i "s/MACOS_SHA_PLACEHOLDER/${MACOS_ARM64_SHA}/g" homebrew-tap/Formula/miniforge.rb
          sed -i "s/LINUX_SHA_PLACEHOLDER/${LINUX_X86_SHA}/g" homebrew-tap/Formula/miniforge.rb

      - name: Commit and push formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/miniforge.rb
          git commit -m "Update miniforge to ${VERSION}"
          git push

  # Trigger the scoop bucket's autoupdate workflow so the manifest picks
  # up this release within seconds instead of waiting for the bucket's
  # daily cron. The bucket workflow listens on `repository_dispatch` of
  # type `miniforge-release`. Reuses the existing GitHub App that the
  # homebrew job authenticates with — the app already has access to all
  # repos in the org, so we just point at scoop-bucket here.
  scoop:
    name: Trigger Scoop Bucket Autoupdate
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: miniforge-ai
          repositories: scoop-bucket

      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh api repos/miniforge-ai/scoop-bucket/dispatches \
            -f event_type=miniforge-release \
            -F "client_payload[version]=$VERSION" \
            -F "client_payload[source]=miniforge-release-${{ github.run_id }}"
          echo "Dispatched miniforge-release event for v$VERSION"
