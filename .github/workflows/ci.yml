name: CI

# This workflow runs linting, tests, and builds on every push and PR. The
# PR-only size check (pr-budget, rejecting a whole PR's cumulative diff past
# 600 reportable lines) lives in its own workflow, pr-size.yml -- it needs to
# re-run on PR body edits (e.g. a MINIFORGE_PR_BUDGET_OVERRIDE line), which
# would otherwise needlessly re-trigger the expensive jobs below.
# All output is captured in log files and uploaded as artifacts for debugging.
# Logs are retained for 7 days and can be downloaded from the Actions UI.
#
# A failed push run on main additionally opens (or updates) a `ci-main-red`
# tracking issue -- see the `main-status` job at the bottom of this file, and
# docs/development/ci-debugging.md.

on:
  push:
    branches: [main]
  # Run on ALL pull requests regardless of base branch. Stacked / autonomous
  # PRs target intermediate `mf/**` branches (not main); a `branches: [main]`
  # filter here silently skipped CI on every such PR. A bare `pull_request`
  # trigger fires for any base, so stacked PRs get linted, tested, and built
  # like any other.
  pull_request:

permissions:
  contents: read

env:
  # Public identifier for the read-only Miniforge CI GitHub App; credentials
  # remain in MINIFORGE_CI_BOT_KEY.
  MINIFORGE_CI_BOT_APP_ID: "3360143"

jobs:
  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest
          bb: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', '**/deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Run Polylith workspace check
        run: |
          set -o pipefail
          echo "::group::Polylith Structure"
          bb poly:check 2>&1 | tee poly-check.log
          echo "::endgroup::"

      - name: Upload structure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-logs-${{ github.sha }}
          path: poly-check.log
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [structure]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest
          bb: latest
          clj-kondo: latest

      - name: Install markdownlint
        run: |
          npm install -g markdownlint-cli

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', '**/deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Lint Clojure
        run: |
          echo "::group::Clojure Linting"
          bb lint:clj:all 2>&1 | tee clj-kondo.log
          echo "::endgroup::"

      - name: Lint Markdown
        run: |
          echo "::group::Markdown Linting"
          bb fmt:md:all 2>&1 | tee markdownlint.log || true
          echo "::endgroup::"
        continue-on-error: true

      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs-${{ github.sha }}
          path: |
            clj-kondo.log
            markdownlint.log
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [structure]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Full history + tags so Polylith can resolve the stable baseline for
        # PR-scoped tests. When no stable tag is present, `bb test` falls back
        # to a full Polylith test sweep rather than failing or under-testing.
        with:
          fetch-depth: 0

      - name: Generate workbench contract token
        id: workbench-contract-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.MINIFORGE_CI_BOT_APP_ID }}
          private-key: ${{ secrets.MINIFORGE_CI_BOT_KEY }}
          owner: miniforge-ai
          repositories: workbench-contract

      - name: Configure workbench contract access
        env:
          WORKBENCH_CONTRACT_TOKEN: ${{ steps.workbench-contract-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${WORKBENCH_CONTRACT_TOKEN}@github.com/miniforge-ai/workbench-contract.git".insteadOf "ssh://git@github.com/miniforge-ai/workbench-contract.git"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest
          bb: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', '**/deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      # Pull requests use stable-derived changed-and-affected scope. Main
      # pushes keep the full suite as the stable-tag authority. GitHub
      # Actions' default Linux shell is `bash -e {0}` — no pipefail; without
      # `set -o pipefail`, `bb ... | tee` reports the exit code of `tee`
      # instead of the test command.
      - name: Run tests
        run: |
          set -o pipefail
          echo "::group::Running Tests"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bb test 2>&1 | tee test-output.log
          else
            bb test:all 2>&1 | tee test-output.log
          fi
          echo "::endgroup::"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: test-output.log
          retention-days: 7

  # Windows fidelity job. Validates the bb-platform / bb-proc unit tests
  # on real Windows, which is what the Windows fidelity pass introduces.
  # The broader integration suite is deferred until known Windows-specific
  # bugs are fixed (Java/.git pack files, governance digests on CRLF — see
  # docs/platform-support.md). Promote scope to bb test:all once those are
  # resolved by the Windows tester.
  test-windows:
    name: Test (Windows, bb-platform unit tests)
    runs-on: windows-latest
    steps:
      # Must come BEFORE actions/checkout — it uses git internally and
      # honors global config at the time of clone. Without this, Windows'
      # default core.autocrlf=true converts every text file to CRLF on
      # checkout, which corrupts the SHA-256 digests that governance
      # config integrity checks (computed on LF content).
      - name: Configure git for stable (LF) line endings
        run: |
          git config --global core.autocrlf input
          git config --global core.eol lf
        shell: pwsh

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install bb (Windows)
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          bb: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', '**/deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      # setup-clojure on Windows installs clojure as a PowerShell module,
      # not a clojure.exe binary. babashka's p/process invokes via Java
      # ProcessBuilder which cannot resolve PowerShell modules, so any step
      # shelling out to `clojure` would fail. deps.clj provides a real
      # clojure.exe / clj.exe on PATH, replacing the need for `cli: latest`.
      - name: Install deps.clj shim (Windows)
        shell: pwsh
        run: |
          $toolVersions = Get-Content -Raw ".github/tool-versions.json" | ConvertFrom-Json
          $depsVersion = $toolVersions.'deps-clj'
          $depsDir = "$env:USERPROFILE\.deps-clj"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/borkdude/deps.clj/releases/download/v${depsVersion}/deps.clj-${depsVersion}-windows-amd64.zip" `
            -OutFile deps.zip
          Expand-Archive deps.zip -DestinationPath $depsDir -Force
          # deps.exe is a drop-in replacement for clojure / clj — provide both names.
          Copy-Item "$depsDir\deps.exe" "$depsDir\clojure.exe"
          Copy-Item "$depsDir\deps.exe" "$depsDir\clj.exe"
          "$depsDir" >> $env:GITHUB_PATH

          Write-Host "clojure/clj installed at $depsDir (via deps.clj $depsVersion)"

      - name: Platform check
        run: bb check:platform
        shell: pwsh

      # Scope: validate the bb-platform component on real Windows. The
      # broader integration suite (`bb test:integration`) hits known
      # Windows-specific bugs (Java cannot delete .git/objects pack files,
      # see docs/platform-support.md). Those are real product bugs to be
      # fixed in follow-up PRs by the Windows tester. Until then, this
      # job exercises the toolchain end-to-end (bb + deps.clj + clojure +
      # cognitect test-runner) and the platform-detection code itself,
      # which is exactly what the Windows fidelity pass introduces.
      - name: Run bb-platform + bb-proc unit tests
        shell: pwsh
        working-directory: projects/bb-utils
        run: |
          clojure -M:test `
            --dir ../../components/bb-platform/test `
            --dir ../../components/bb-proc/test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate workbench contract token
        id: workbench-contract-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.MINIFORGE_CI_BOT_APP_ID }}
          private-key: ${{ secrets.MINIFORGE_CI_BOT_KEY }}
          owner: miniforge-ai
          repositories: workbench-contract

      - name: Configure workbench contract access
        env:
          WORKBENCH_CONTRACT_TOKEN: ${{ steps.workbench-contract-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${WORKBENCH_CONTRACT_TOKEN}@github.com/miniforge-ai/workbench-contract.git".insteadOf "ssh://git@github.com/miniforge-ai/workbench-contract.git"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest
          bb: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', '**/deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Compile all code
        run: |
          set -o pipefail
          echo "::group::Compiling Code"
          bb compile 2>&1 | tee compile.log
          echo "::endgroup::"

      - name: Build CLI
        run: |
          set -o pipefail
          echo "::group::Building CLI"
          bb build:cli 2>&1 | tee build-cli.log
          echo "::endgroup::"

      - name: Test CLI
        run: |
          set -o pipefail
          echo "::group::Testing CLI"
          bb --jar dist/miniforge.jar -m ai.miniforge.cli.main version 2>&1 | tee -a cli-test.log
          bb --jar dist/miniforge.jar -m ai.miniforge.cli.main help 2>&1 | tee -a cli-test.log
          echo "::endgroup::"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            compile.log
            build-cli.log
            cli-test.log
          retention-days: 7

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniforge-cli-${{ github.sha }}
          path: dist/miniforge.jar
          retention-days: 7

  # Alerting for a red `main`. Until this existed, a failing push run
  # produced no signal at all: the Test job was red across six consecutive
  # merges (runs 30734048427 through 30735684110), for two independent
  # reasons, and the second went unnoticed until someone looked by hand.
  #
  # The channel is a GitHub issue because there is no chat webhook secret on
  # this repo or the org -- only the CI-bot app credentials. Repo watchers
  # already get notified on issue creation, and the push author is mentioned
  # in the body.
  #
  # No checkout and no toolchain setup, deliberately: the alerter has to
  # survive the failure it reports. A bb- or Clojure-based alerter would be
  # taken out by exactly the deps/toolchain breakage it exists to announce.
  # `gh` is preinstalled on GitHub-hosted runners.
  main-status:
    name: Alert on main status
    runs-on: ubuntu-latest
    needs: [structure, lint, test, test-windows, build]
    # Push-to-main only: PR failures are already visible on the PR itself.
    # `!cancelled()` keeps a manual cancellation from being reported as
    # breakage. Green runs are included so the tracking issue gets closed.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      issues: write
      actions: read
    # Serializes alert jobs across overlapping main runs so two failures
    # landing together cannot each decide no issue exists and file one.
    concurrency:
      group: main-status-alert
      cancel-in-progress: false
    steps:
      - name: Open, update, or close the red-main tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so gh cannot infer the repo from a git remote.
          GH_REPO: ${{ github.repository }}
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail

          label='ci-main-red'
          body_file="${RUNNER_TEMP}/main-status-body.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Any failed dependency means red, whatever else happened. A run
          # with no failure but a non-success result (cancelled, skipped) is
          # not evidence that main is healthy, so it is left alone.
          outcome=green
          for result in ${JOB_RESULTS}; do
            case "${result}" in
              success) ;;
              failure) outcome=red; break ;;
              *)       outcome=inconclusive ;;
            esac
          done

          # Reuse an open tracking issue instead of filing one per run.
          # Queried through the REST list endpoint rather than `gh issue
          # list --search`: the search index is eventually consistent, so a
          # freshly created issue can be invisible to the next run's lookup.
          # `/issues` also returns pull requests -- filter them out.
          issue=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=${label}&per_page=100" \
            --jq 'map(select(.pull_request == null)) | .[0].number // empty')

          if [ "${outcome}" = 'green' ]; then
            if [ -n "${issue}" ]; then
              gh issue close "${issue}" \
                --comment "\`main\` is green again as of ${GITHUB_SHA}. Run: ${run_url}"
            fi
            exit 0
          fi

          if [ "${outcome}" != 'red' ]; then
            echo "Inconclusive run (${JOB_RESULTS}); not alerting."
            exit 0
          fi

          # Best-effort detail. Losing it must not lose the alert.
          failed_jobs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' \
            || true)

          cat > "${body_file}" <<EOF
          CI failed on a push to \`main\`.

          - Run: ${run_url}
          - Commit: ${GITHUB_SHA}
          - Pushed by: @${GITHUB_ACTOR}
          - Failed jobs: ${failed_jobs:-unknown, see the run}

          One issue is reused for every consecutive red run on \`main\`; each
          further failure lands here as a comment. It closes automatically on
          the next fully green \`main\` push.
          EOF

          if [ -n "${issue}" ]; then
            gh issue comment "${issue}" --body-file "${body_file}"
          else
            # Idempotent: the label survives from earlier breaks.
            gh label create "${label}" \
              --color b60205 \
              --description 'CI is failing on main' >/dev/null 2>&1 || true
            gh issue create \
              --title 'CI is red on main' \
              --label "${label}" \
              --body-file "${body_file}"
          fi
