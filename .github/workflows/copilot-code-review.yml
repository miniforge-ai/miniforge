name: Copilot review environment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml
      - .github/tool-versions.json

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code and pinned standards
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      # Bootstrap the pinned installer before Babashka is available.
      - name: Read pinned tool versions
        id: tools
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' .github/tool-versions.json >> "$GITHUB_OUTPUT"

      - name: Install pinned Clojure tools
        uses: DeLaGuardo/setup-clojure@bc7570e912b028bbcc22f457adec7fdf98e2f4ed # 12.5
        with:
          cli: ${{ steps.tools.outputs.clojure-cli }}
          bb: ${{ steps.tools.outputs.babashka }}
          clj-kondo: ${{ steps.tools.outputs.clj-kondo }}

      - name: Validate Polylith composition
        run: bb poly:check

      - name: Prepare CLI dependencies and package
        run: bb build:cli

      - name: Validate Babashka task classpaths
        run: bb check:bb-classpaths
